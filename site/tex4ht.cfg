% site/tex4ht.cfg — the TeX4ht configuration the published site is built with.
%
%   make4ht -u -c site/tex4ht.cfg -d build/html main.tex "mathjax"
%
% It exists for exactly one reason, and it is not cosmetic.
%
% This repository's central coupling is that a ledger node id *is* its manuscript
% \label, which is what gives every mathematical object a stable address without a
% second, web-specific identifier. A default TeX4ht conversion destroys that: it emits
% generated anchors — x1-5001r3, QQ2-1-5 — and drops the \label names entirely, so
% `main.html#conj:example` lands nowhere and the site would have to invent its own id
% scheme to link a statement. That is precisely the second identifier the anchor
% invariant exists to avoid.
%
% Redefining \label to *also* emit an HTML anchor of the same name restores it. The
% LaTeX label keeps working (\ref, \pageref and the PDF build are untouched — this file
% is read only by TeX4ht), and every claim gains an id a reader and the site can address:
%
%   build/html/main.html#conj:example
%
% Verified on this repository's own manuscript and on both worked-example dossiers:
% ids survive verbatim, colons included; amsthm environments keep their names and
% numbering; and mathematics comes out as \(...\) for MathJax.
%
% Why a .cfg rather than a few lines in preamble.tex: \HCode is not available when
% preamble.tex is read, so the same redefinition placed there silently does nothing —
% the build stays green and the anchors stay missing, which is the worst of both.

\Preamble{xhtml}

\makeatletter
\let\harness@label\label
% \label{x} still labels x, and now also plants <a id="x">. Anchors are emitted for
% structural labels too (\section, equations): they cost nothing, and a node's anchor
% cannot be told from a section's at this level anyway — the ledger is what says which
% labels are claims.
\renewcommand{\label}[1]{\harness@label{#1}\HCode{<a id="#1" class="anchor"></a>}}
\makeatother

\begin{document}
\EndPreamble
