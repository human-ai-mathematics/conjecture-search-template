# The MyST project: the manuscript (modules/) and the full proofs (solutions/).
#
#   npx myst start           # read it locally, live
#   npx myst build --html    # the static site, as pages.yml publishes it
#
# `uv run scripts/check.py` builds the project and reads its AST: every labelled claim
# directive under modules/ is a ledger node with the same id.
# Replace the title, subtitle and author placeholders below.
version: 1
project:
  title: <Document title>
  subtitle: <one-line subtitle naming the object and the question>
  authors:
    - name:
        literal: <author>
  # The shared bibliography. A literature node's `references:` keys must
  # exist here. It ships empty: MyST refuses a .bib holding only comments.
  bibliography:
    - references.bib
  # Macros for every module and dossier. A fixed normalization is a `definition` node,
  # not only a macro.
  math:
    # --- core macros (domain-neutral)
    '\R': '\mathbb{R}'
    '\E': '\mathbb{E}'
    '\Prob': '\mathbb{P}'
    '\one': '\mathbf{1}'
    '\eps': '\varepsilon'
    '\dd': '\,\mathrm{d}'
    '\norm': '\left\lVert #1\right\rVert'
    '\abs': '\left\lvert #1\right\rvert'
    '\inner': '\left\langle #1,#2\right\rangle'
    # --- program macros
  # Each statement shows its status, read from the ledger: see scripts/status.mjs.
  plugins:
    - scripts/status.mjs
  # The manuscript comes first, then the full proofs. A pattern that matches nothing is
  # an error, so the proofs' pattern also matches their introduction page:
  # '{proofs,solutions/*}.md' reads "proofs.md, then every dossier". Drafts are listed
  # here for local reading; the pages workflow removes them before it publishes.
  toc:
    - pattern: 'modules/!(README).md'
    - title: Full proofs
      children:
        - pattern: '{proofs,solutions/*}.md'
site:
  template: book-theme
  options:
    logo_text: <Document title>
