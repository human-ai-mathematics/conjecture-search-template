# The manuscript's MyST project: modules/ and solutions/ are its source, and this file
# is what main.tex and preamble.tex used to be.
#
#   npx myst start           # read it locally, live
#   npx myst build --pdf     # the manuscript and every dossier, through templates/latex
#   npx myst build --html    # the static site, as the `site` workflow publishes it
#
# `python3 scripts/check.py` builds the site content (never the PDF) and reads its AST:
# every labelled claim directive under modules/ is a ledger node whose `kind` is the
# directive's name. Build output lands in _build/, which is gitignored.
#
# The title, the subtitle and the author below are placeholders
# `python3 scripts/check.py publish-ready` looks for; the abstract is the `abstract`
# part at the top of modules/00-overview.md.
version: 1
project:
  title: &title <Document title>
  subtitle: <one-line subtitle naming the object and the question>
  authors:
    - name:
        literal: <author>
  # The single shared bibliography: every module and dossier cites into it. A ledger node
  # with `provenance: literature` carries an `import_class` and lists keys from this file
  # in `references:`, and scripts/check.py resolves each one here, so add the entry before
  # the node. An unreviewed preprint cannot support a proved node. The file ships empty
  # because a .bib holding only comments is one MyST refuses to read.
  bibliography:
    - references.bib
  # The LaTeX macros every module and dossier may use. Keep the core block diffable
  # against the template and add this program's own notation below it. A macro that
  # stands for a fixed normalization records that convention in the ledger, not here:
  # state it in a prf:definition under a :label: with a `kind: definition` node.
  math:
    # --- core macros (domain-neutral)
    '\R': '\mathbb{R}'
    '\E': '\mathbb{E}'
    '\Prob': '\mathbb{P}'
    '\one': '\mathbf{1}'
    '\eps': '\varepsilon'
    '\dd': '\,\mathrm{d}'
    '\norm': '\left\lVert #1\right\rVert'
    '\abs': '\left\lvert #1\right\rvert'
    '\inner': '\left\langle #1,#2\right\rangle'
    # --- program macros
  toc:
    - file: index.md
    - pattern: '{modules,solutions}/!(README).md'
  exports:
    - id: manuscript
      format: pdf+tex
      template: templates/latex
      title: *title
      output: _build/exports/manuscript.pdf
      toc:
        - file: index.md
        - pattern: modules/*.md
site:
  template: book-theme
