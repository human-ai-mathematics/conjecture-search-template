# The MyST project for the harness specification, docs/SPECIFICATION.md. It is its own
# project, like example/, so that the manuscript site the root myst.yml publishes stays
# mathematics only.
#
#   cd docs && npx myst start          # read it locally, live
#   cd docs && npx myst build --pdf    # _build/exports/specification.pdf
#
# The PDF export is declared in the page's own front matter, as a dossier's is, so that
# its headings number as sections. docs/RUNNING-A-SEARCH.md is deliberately not in the
# toc: it is read on GitHub as plain Markdown. Build output lands in docs/_build/, which
# is gitignored.
version: 1
project:
  title: Conjecture search harness
  toc:
    - file: SPECIFICATION.md
site:
  template: book-theme
