# The structural checker's one dependency, declared so a fresh clone can install it.
#
# scripts/check.py needs PyYAML and nothing else; everything else it uses is in the
# standard library. Before this file existed the requirement was written down only in the
# error message you got when it was missing, and the sole manifest in the repository —
# experiments/pyproject.toml — covered the numerics harness instead.
#
#   uv run python scripts/check.py        # uv reads this file and provisions on the fly
#   pip install pyyaml                    # or just install it
#
# ./scripts/check.sh does the first automatically when python3 cannot import yaml.
#
# The numerical harness is a separate project with its own lock file, because it pins
# numpy and this does not: see experiments/pyproject.toml.
[project]
name = "conjecture-search-harness"
version = "0"
description = "Structural checker and scaffolds for a sustained conjecture search"
requires-python = ">=3.11"
dependencies = ["pyyaml>=6"]

[tool.uv]
package = false
