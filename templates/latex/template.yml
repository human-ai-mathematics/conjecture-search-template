# The LaTeX template every PDF export in this repository uses: the manuscript
# (myst.yml, id `manuscript`) and each proof dossier (its own front matter).
#
# Adapted from myst-templates/plain_latex (CC-BY-4.0, Steve Purves, Curvenote), with
# the logo, the date package and the online-link footnote removed, and pdflatex
# instead of xelatex so the TeX Live that already builds a dossier builds this too.
# Being local, an export never downloads a template.
jtex: v1
title: Conjecture search manuscript
description: A plain article for the manuscript and for standalone proof dossiers
version: 1.0.0
license: CC-BY-4.0
tags:
  - article
parts:
  - id: abstract
    description: The manuscript abstract, marked as a part in the first module.
doc:
  - id: title
    required: true
  - id: authors
  - id: bibliography
build:
  engine: -pdf
files:
  - template.tex
packages:
  - geometry
  - fontenc
  - lmodern
  - microtype
  - amssymb
  - mathtools
  - underscore
  - hyperref
  - xcolor
  - graphicx
  - natbib
