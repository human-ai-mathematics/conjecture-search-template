# Publish the derived site to GitHub Pages.
#
# The order is the point: **validate, then build, then deploy**. A structurally invalid
# revision is not this repository's research state, and `scripts/site.py` refuses to
# publish one — but by then the LaTeX has already been compiled, so the checker runs
# first and fails the job in seconds rather than minutes.
#
# What gets deployed:
#
#   data.json            derived from the same report `scripts/check.py` prints
#   index.html + assets  the frontend, which holds no mathematics
#   pdf/                 the manuscript and every dossier an active proof record names
#   html/                the same, converted by make4ht through site/tex4ht.cfg, so a
#                        claim is readable at its own anchor: main.html#conj:example
#
# Before the first run, a human has to enable Pages for this repository with
# **Settings → Pages → Build and deployment → Source: GitHub Actions**. Nothing in this
# file can do that, and until it is done the deploy step fails with a 404.
#
# A failed build leaves the previously deployed site online while the repository moves
# on. That is why every page carries its source commit and build time: a reader can
# always tell which revision they are looking at.
#
# This workflow runs only when a human asks for it. Compiling the manuscript installs
# TeX Live and builds every certified dossier, which is minutes of runner time on a
# revision nobody has asked to publish, and publishing is a deliberate act: the site is
# a snapshot a reader is invited to cite, not a mirror of whatever was pushed last.
# The cheap structural checks still run on their own, on pull requests, in `check.yml`.

name: site

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The site links every statement to its source at the exact commit it was
          # built from, so the build needs to know what that commit is.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install the checker's one dependency
        run: pip install pyyaml

      # ---- validate -----------------------------------------------------------------
      #
      # Structure first, and the worked example alongside it: the example is a fixture
      # the repository keeps green, and a site build is the first thing that would
      # notice if it stopped being one.

      - name: Validate the repository
        run: python3 scripts/check.py

      - name: Validate the worked example
        run: python3 scripts/check.py --root example

      - name: Run the checker's own test suite
        run: python3 -m unittest discover -s scripts/tests -p 'test_*.py'

      # ---- build the documents ------------------------------------------------------

      - name: Install TeX Live
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            texlive-latex-recommended texlive-latex-extra texlive-science \
            texlive-fonts-recommended texlive-extra-utils \
            texlive-bibtex-extra biber latexmk
          # texlive-bibtex-extra is what provides biblatex.sty; preamble.tex loads
          # biblatex and biber is only its backend, so omitting it fails the build.
          command -v make4ht

      - name: Compile the manuscript
        run: latexmk -pdf -interaction=nonstopmode -outdir=build main.tex

      - name: Compile every dossier the ledger certifies
        run: |
          # `check.py dossiers` is machine-readable for exactly this: it lists the
          # dossiers an active proofs[] record names, which is what the ledger vouches
          # for. Compiling a dossier standalone is part of the proof definition of done
          # and nothing else in CI exercises it.
          python3 scripts/check.py dossiers | while read -r dossier; do
            [ -n "$dossier" ] || continue
            latexmk -pdf -interaction=nonstopmode -cd -outdir="$PWD/build" "$dossier"
          done

      - name: Convert the manuscript and dossiers to HTML
        run: |
          # site/tex4ht.cfg is what preserves the anchor invariant through the
          # conversion; without it every \label becomes an opaque generated id and
          # `main.html#conj:example` lands nowhere. See that file for the detail.
          mkdir -p build/html
          make4ht -u -c site/tex4ht.cfg -d build/html main.tex "mathjax"
          python3 scripts/check.py dossiers | while read -r dossier; do
            [ -n "$dossier" ] || continue
            (cd "$(dirname "$dossier")" \
              && make4ht -u -c "$GITHUB_WORKSPACE/site/tex4ht.cfg" \
                   -d "$GITHUB_WORKSPACE/build/html" "$(basename "$dossier")" "mathjax")
          done

      # ---- build the site -----------------------------------------------------------

      - name: Build the site
        run: |
          python3 scripts/site.py \
            --out build/site --pdf-dir build --html-dir build/html

      - name: Check that the frontend parses
        run: node --check site/site.js

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/site

  deploy:
    # Only the default branch publishes. Dispatching from any other branch builds the
    # site and stops there, which is how you check that a revision *can* be published
    # without publishing it.
    if: github.ref_name == github.event.repository.default_branch
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
