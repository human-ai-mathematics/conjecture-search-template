# Publish the manuscript and its proof dossiers to GitHub Pages, as MyST renders them.
#
# Validate, then build, then deploy: a structurally invalid revision is not this
# repository's research state, so the checker runs first and a red one publishes nothing.
#
# This workflow runs only when a human asks for it. Publishing is a deliberate act: the
# site is a snapshot a reader is invited to cite, not a mirror of whatever was pushed last.
# The structural checks still run on their own, on pull requests, in `check.yml`.
#
# Before the first run, a human has to enable Pages for this repository with
# **Settings → Pages → Build and deployment → Source: GitHub Actions**. Until then the
# deploy step fails with a 404.

name: site

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PyYAML
        run: pip install pyyaml

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install MyST
        run: npm ci

      - name: Validate the repository
        run: python3 scripts/check.py

      # A project site is served under /<repository>/, and MyST has to know it.
      - name: Build the site
        run: npx myst build --html
        env:
          BASE_URL: /${{ github.event.repository.name }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _build/html

  deploy:
    # Only the default branch publishes. Dispatching from any other branch builds the site
    # and stops there, which is how you check that a revision *can* be published.
    if: github.ref_name == github.event.repository.default_branch
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
