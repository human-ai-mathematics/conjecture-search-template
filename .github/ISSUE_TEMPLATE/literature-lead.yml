# Existing work that bears on the search.
#
# The single most valuable contribution a passing mathematician can make, and the
# cheapest to give: a search that does not know a result exists will re-derive it.
name: Literature lead
description: Published or preprint work that settles, weakens, or bounds something here.
title: "Literature: "
labels: ["literature", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        A pointer to work that already exists is often worth more than an attempt.

        An imported result becomes a ledger node with `provenance: literature`, and its
        logical status stays independent of where it came from: an unreviewed preprint
        is recorded as **open**, not proved, until its proof has been reviewed. Saying
        which of the three classes below applies is therefore not bookkeeping — it is
        the status.

  - type: input
    id: anchor
    attributes:
      label: What it bears on
      description: >
        A ledger node id, a route id, or the target. The site fills this in.
      placeholder: "q:example"
    validations:
      required: true

  - type: textarea
    id: reference
    attributes:
      label: The reference
      description: Authors, title, venue or arXiv id, year. A BibTeX entry is ideal.
    validations:
      required: true

  - type: dropdown
    id: import_class
    attributes:
      label: What kind of source it is
      options:
        - Published, peer-reviewed
        - Preprint, but the proof has been reviewed somewhere I can point to
        - Preprint, unreviewed
    validations:
      required: true

  - type: textarea
    id: bearing
    attributes:
      label: What it does to the search
      description: >
        Does it settle the statement, weaken it, bound it, or only resemble it? Name the
        theorem number if you can, and say plainly if the fit is partial — a near miss
        recorded honestly is still useful, and one recorded as a hit is expensive.
    validations:
      required: true

  - type: textarea
    id: gap
    attributes:
      label: What still would not be settled
      description: Optional, and often the most useful field on this form.
