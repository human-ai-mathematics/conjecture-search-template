name: Correction
description: An error in a page, a proof or a statement.
labels: [correction]
body:
  - type: input
    id: where
    attributes:
      label: Where
      description: The page and the result, e.g. "Results, Theorem B", or the identifier.
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What is wrong
      description: The error and, if you have it, the fix.
    validations:
      required: true
