name: Correction
description: An error in a page, a proof or a statement.
labels: [correction]
body:
  - type: input
    id: statement
    attributes:
      label: Statement
      description: The label shown next to the statement, e.g. conj:main, or the page if the error is elsewhere.
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What is wrong
      description: The error and, if you have it, the fix.
    validations:
      required: true
