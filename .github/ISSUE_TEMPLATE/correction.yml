# Something in the manuscript, a gloss, or a rendering of either is wrong.
#
# Kept separate from a proof gap because it usually is not one: a broken link, a summary
# that no longer matches its statement, a status that looks stale. Cheap to fix, and
# corrosive if there is nowhere to report it.
name: Correction
description: A link, gloss, status or page that is wrong or out of date.
title: "Correction: "
labels: ["correction", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        One case is worth telling apart: **the gloss disagrees with the statement.** A
        ledger node's one-line summary is a gloss, and the statement in the manuscript is
        canonical. If they disagree, the manuscript is right and the gloss is the defect.

  - type: input
    id: anchor
    attributes:
      label: Where
      description: The node, route or page id.
      placeholder: "prop:example"

  - type: textarea
    id: problem
    attributes:
      label: What is wrong
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What it should say
