# Issues are for things that are actionable. Conversation goes to Discussions.
#
# `blank_issues_enabled: true` on purpose: the five forms cover the usual reports, and a
# contributor with something that fits none of them should not have to pretend it does.
#
# The URL below is the only place in the repository that hardcodes the owner/repo slug.
# A fork therefore has to repoint exactly this file, which is README.md's instantiation
# step 5.
blank_issues_enabled: true
contact_links:
  - name: Ask a question, or think out loud
    url: https://github.com/numina-functional-inequalities/conjecture-search-template/discussions
    about: >
      Interpretation, background, why a route was abandoned, whether an idea is worth
      trying. Nothing has to be finished to be worth saying here.
