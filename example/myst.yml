# The worked example's MyST project. Same shape as the root myst.yml; see that file.
version: 1
project:
  title: &title Worked example
  authors:
    - name: Template author
  math:
    '\R': '\mathbb{R}'
  toc:
    - file: index.md
    - pattern: '{modules,solutions}/!(README).md'
  exports:
    - id: manuscript
      format: pdf+tex
      template: ../templates/latex
      title: *title
      output: _build/exports/manuscript.pdf
      toc:
        - file: index.md
        - pattern: modules/*.md
site:
  template: book-theme
