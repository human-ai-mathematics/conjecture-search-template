# The worked example's MyST project. Same shape as the root myst.yml; see that file.
version: 1
project:
  title: Worked example
  authors:
    - name: Template author
  math:
    '\R': '\mathbb{R}'
  toc:
    - file: site/index.md
    - file: site/problem.md
    - file: site/results.md
    - title: Open problems
      children:
        - pattern: 'site/open{,/*}.md'
    - file: site/about.md
    - title: Full proofs
      children:
        - pattern: '{site/proofs,solutions/*}.md'
    - title: Precise statements
      children:
        - pattern: 'modules/!(README).md'
site:
  template: book-theme
  options:
    logo_text: Worked example
